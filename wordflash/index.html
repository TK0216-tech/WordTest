<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FlashCards - スマート単語帳アプリ</title>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-gradient: linear-gradient(135deg, #f0f4ff 0%, #e8eeff 50%, #f5f3ff 100%);
      --card-bg: #ffffff;
      --card-border: rgba(226, 232, 240, 0.8);
      --text-main: #0f172a;
      --text-muted: #64748b;
      --text-sub: #475569;
      --primary: #4f46e5;
      --primary-hover: #4338ca;
      --primary-light: #eef2ff;
      --primary-focus-ring: rgba(79, 70, 229, 0.2);
      --success: #10b981;
      --success-light: #ecfdf5;
      --success-border: #a7f3d0;
      --error: #ef4444;
      --error-light: #fef2f2;
      --error-border: #fecaca;
      --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
      --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.08), 0 2px 4px -2px rgba(0, 0, 0, 0.04);
      --shadow-lg: 0 12px 28px -4px rgba(79, 70, 229, 0.09), 0 8px 12px -6px rgba(0, 0, 0, 0.04);
      --radius-sm: 8px;
      --radius-md: 14px;
      --radius-lg: 20px;
      --transition: all 0.22s cubic-bezier(0.4, 0, 0.2, 1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Plus Jakarta Sans', 'Noto Sans JP', sans-serif;
      background: var(--bg-gradient);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px 16px 40px;
    }

    .app-container {
      width: 100%;
      max-width: 600px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    /* Header */
    header {
      text-align: center;
      padding: 6px 0;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 12px;
      background: var(--primary-light);
      color: var(--primary);
      border-radius: 9999px;
      font-size: 0.8rem;
      font-weight: 600;
      letter-spacing: 0.03em;
      margin-bottom: 8px;
    }

    .app-title {
      font-family: 'Outfit', 'Noto Sans JP', sans-serif;
      font-size: 1.85rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: var(--text-main);
    }

    /* CSV Import & Settings Toolbar */
    .toolbar-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: var(--radius-md);
      padding: 12px 16px;
      box-shadow: var(--shadow-sm);
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .csv-status-wrap {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    .status-indicator {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--success);
      box-shadow: 0 0 0 2px var(--success-light);
    }

    .toolbar-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .btn-file-label {
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 12px;
      background: #f1f5f9;
      color: var(--text-sub);
      font-size: 0.82rem;
      font-weight: 600;
      border-radius: var(--radius-sm);
      transition: var(--transition);
      border: 1px solid #e2e8f0;
    }

    .btn-file-label:hover {
      background: #e2e8f0;
      color: var(--text-main);
    }

    #csv-file-input {
      display: none;
    }

    .mode-toggle-btn {
      padding: 6px 12px;
      background: #f1f5f9;
      color: var(--text-sub);
      font-size: 0.82rem;
      font-weight: 600;
      border-radius: var(--radius-sm);
      border: 1px solid #e2e8f0;
      cursor: pointer;
      transition: var(--transition);
    }

    .mode-toggle-btn:hover {
      background: #e2e8f0;
      color: var(--text-main);
    }

    /* Scoreboard */
    .score-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
    }

    .score-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: var(--radius-md);
      padding: 14px 12px;
      text-align: center;
      box-shadow: var(--shadow-sm);
      transition: var(--transition);
    }

    .score-card:hover {
      transform: translateY(-2px);
      box-shadow: var(--shadow-md);
    }

    .score-label {
      font-size: 0.78rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--text-muted);
      margin-bottom: 4px;
    }

    .score-value {
      font-family: 'Outfit', sans-serif;
      font-size: 1.55rem;
      font-weight: 700;
      color: var(--text-main);
      line-height: 1.1;
    }

    .score-card.accuracy .score-value {
      color: var(--primary);
    }

    /* Main Flashcard */
    .flashcard {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: var(--radius-lg);
      padding: 32px 28px;
      box-shadow: var(--shadow-lg);
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 380px;
    }

    /* Progress bar */
    .progress-bar-container {
      width: 100%;
      height: 6px;
      background: #f1f5f9;
      border-radius: 9999px;
      overflow: hidden;
      margin-bottom: 24px;
    }

    .progress-bar-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #6366f1, #4f46e5);
      border-radius: 9999px;
      transition: width 0.3s ease;
    }

    .card-meta {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text-muted);
      margin-bottom: 24px;
    }

    .question-box {
      width: 100%;
      text-align: center;
      margin: 10px 0 28px;
      padding: 10px 0;
    }

    .question-caption {
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--primary);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 8px;
    }

    .question-text {
      font-family: 'Outfit', 'Noto Sans JP', sans-serif;
      font-size: 2.4rem;
      font-weight: 700;
      color: var(--text-main);
      line-height: 1.25;
      word-break: break-word;
      transition: var(--transition);
    }

    /* Input & Action */
    .answer-form {
      width: 100%;
      max-width: 440px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .input-wrapper {
      position: relative;
      width: 100%;
    }

    .answer-input {
      width: 100%;
      height: 52px;
      padding: 0 16px;
      font-size: 1.15rem;
      font-family: 'Plus Jakarta Sans', 'Noto Sans JP', sans-serif;
      border: 2px solid #e2e8f0;
      border-radius: var(--radius-md);
      background: #fafbfc;
      color: var(--text-main);
      outline: none;
      transition: var(--transition);
      text-align: center;
    }

    .answer-input:focus {
      border-color: var(--primary);
      background: #ffffff;
      box-shadow: 0 0 0 4px var(--primary-focus-ring);
    }

    .answer-input:disabled {
      background: #f8fafc;
      cursor: not-allowed;
    }

    .primary-btn {
      width: 100%;
      height: 50px;
      background: var(--primary);
      color: #ffffff;
      font-size: 1.05rem;
      font-weight: 600;
      border: none;
      border-radius: var(--radius-md);
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(79, 70, 229, 0.3);
      transition: var(--transition);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .primary-btn:hover {
      background: var(--primary-hover);
      transform: translateY(-1px);
      box-shadow: 0 6px 18px rgba(79, 70, 229, 0.35);
    }

    .primary-btn:active {
      transform: translateY(0);
    }

    /* Feedback Banner */
    .feedback-banner {
      width: 100%;
      max-width: 440px;
      border-radius: var(--radius-md);
      padding: 16px;
      margin-top: 16px;
      display: none;
      animation: popIn 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    @keyframes popIn {
      0% {
        opacity: 0;
        transform: scale(0.96) translateY(4px);
      }
      100% {
        opacity: 1;
        transform: scale(1) translateY(0);
      }
    }

    .feedback-banner.correct {
      display: block;
      background: var(--success-light);
      border: 1px solid var(--success-border);
      color: #065f46;
    }

    .feedback-banner.wrong {
      display: block;
      background: var(--error-light);
      border: 1px solid var(--error-border);
      color: #991b1b;
    }

    .feedback-header {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 1.05rem;
      font-weight: 700;
      margin-bottom: 6px;
    }

    .feedback-detail {
      font-size: 0.9rem;
      line-height: 1.4;
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .feedback-detail span.label {
      font-weight: 600;
      color: #6b7280;
      font-size: 0.8rem;
    }

    .feedback-detail span.ans {
      font-weight: 700;
      font-size: 1.05rem;
      color: #111827;
    }

    /* Next button */
    .next-btn {
      width: 100%;
      max-width: 440px;
      height: 48px;
      margin-top: 14px;
      background: #0f172a;
      color: #ffffff;
      font-size: 1rem;
      font-weight: 600;
      border: none;
      border-radius: var(--radius-md);
      cursor: pointer;
      display: none;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: var(--transition);
      box-shadow: 0 4px 12px rgba(15, 23, 42, 0.2);
    }

    .next-btn:hover {
      background: #1e293b;
      transform: translateY(-1px);
    }

    /* Complete Screen */
    .complete-container {
      display: none;
      text-align: center;
      padding: 20px 10px;
      width: 100%;
      max-width: 440px;
      animation: popIn 0.3s ease;
    }

    .complete-emoji {
      font-size: 3.5rem;
      margin-bottom: 12px;
    }

    .complete-title {
      font-size: 1.6rem;
      font-weight: 700;
      margin-bottom: 8px;
    }

    .complete-desc {
      font-size: 0.95rem;
      color: var(--text-muted);
      margin-bottom: 24px;
    }

    .complete-stats-box {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: var(--radius-md);
      padding: 16px;
      margin-bottom: 24px;
      display: flex;
      justify-content: space-around;
    }

    .restart-btn {
      width: 100%;
      height: 50px;
      background: var(--primary);
      color: #ffffff;
      font-size: 1.05rem;
      font-weight: 600;
      border: none;
      border-radius: var(--radius-md);
      cursor: pointer;
      transition: var(--transition);
    }

    .restart-btn:hover {
      background: var(--primary-hover);
    }

    /* Helper tip */
    .shortcut-hint {
      text-align: center;
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-top: 4px;
    }

    .shortcut-hint kbd {
      background: #e2e8f0;
      border-radius: 4px;
      padding: 2px 6px;
      font-family: inherit;
      font-weight: 600;
      font-size: 0.75rem;
    }

    /* Responsive adjustments */
    @media (max-width: 480px) {
      body {
        padding: 16px 12px;
      }

      .app-title {
        font-size: 1.55rem;
      }

      .flashcard {
        padding: 24px 18px;
        min-height: 350px;
      }

      .question-text {
        font-size: 2rem;
      }

      .score-value {
        font-size: 1.35rem;
      }
    }
  </style>
</head>
<body>
  <div class="app-container">
    <!-- Header -->
    <header>
      <div class="badge">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12 7-7 7 7"/><path d="M12 19V5"/></svg>
        FlashCards Learning
      </div>
      <h1 class="app-title">単語帳フラッシュカード</h1>
    </header>

    <!-- Toolbar: CSV Import & Order Toggle -->
    <section class="toolbar-card" aria-label="ツールバー">
      <div class="csv-status-wrap">
        <span class="status-indicator" id="status-indicator"></span>
        <span id="csv-filename-label">vocabulary_list.csv 読込中...</span>
      </div>
      <div class="toolbar-actions">
        <label for="csv-file-input" class="btn-file-label" title="外部CSVファイルを選択して読み込みます">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
          CSV選択
        </label>
        <input type="file" id="csv-file-input" accept=".csv,text/csv">
        <button type="button" class="mode-toggle-btn" id="mode-toggle-btn" title="出題順序を切り替えます">
          順序: 順番通り
        </button>
      </div>
    </section>

    <!-- Real-time Score Board -->
    <section class="score-grid" aria-label="リアルタイムスコア">
      <div class="score-card">
        <div class="score-label">出題数</div>
        <div class="score-value" id="score-total">0</div>
      </div>
      <div class="score-card">
        <div class="score-label">正解数</div>
        <div class="score-value" id="score-correct">0</div>
      </div>
      <div class="score-card accuracy">
        <div class="score-label">正答率</div>
        <div class="score-value" id="score-accuracy">0.0%</div>
      </div>
    </section>

    <!-- Main Flashcard Area -->
    <main class="flashcard" id="flashcard-panel">
      <!-- Progress Bar -->
      <div class="progress-bar-container">
        <div class="progress-bar-fill" id="progress-bar-fill"></div>
      </div>

      <!-- Question Counter & Badge -->
      <div class="card-meta">
        <span id="card-progress-text">問題 1 / 10</span>
        <span id="card-item-id">No. 1</span>
      </div>

      <!-- Question Text -->
      <div class="question-box">
        <div class="question-caption">Question</div>
        <div class="question-text" id="question-text">読み込み中...</div>
      </div>

      <!-- Answer Input Form -->
      <form class="answer-form" id="answer-form" onsubmit="return false;">
        <div class="input-wrapper">
          <input
            type="text"
            id="answer-input"
            class="answer-input"
            placeholder="答えを入力..."
            autocomplete="off"
            autocorrect="off"
            autocapitalize="off"
            spellcheck="false"
          >
        </div>
        <button type="submit" id="submit-btn" class="primary-btn">
          <span>解答する</span>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
        </button>
      </form>

      <!-- Feedback Area -->
      <div class="feedback-banner" id="feedback-banner">
        <div class="feedback-header" id="feedback-header"></div>
        <div class="feedback-detail">
          <span class="label">正解:</span>
          <span class="ans" id="feedback-correct-answer"></span>
        </div>
      </div>

      <!-- Next Question Button -->
      <button type="button" class="next-btn" id="next-btn">
        <span>次の問題へ進む</span>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>
      </button>

      <!-- Completion Screen (Shown when all cards are completed) -->
      <div class="complete-container" id="complete-container">
        <div class="complete-emoji" id="complete-emoji">🎉</div>
        <h2 class="complete-title">セッション完了！</h2>
        <p class="complete-desc">読み込んだ単語リストの学習が終了しました。</p>
        <div class="complete-stats-box">
          <div>
            <div class="score-label">解答総数</div>
            <div class="score-value" id="final-total">0</div>
          </div>
          <div>
            <div class="score-label">正解数</div>
            <div class="score-value" id="final-correct">0</div>
          </div>
          <div>
            <div class="score-label">最終正答率</div>
            <div class="score-value" id="final-accuracy" style="color: var(--primary);">0%</div>
          </div>
        </div>
        <button type="button" class="restart-btn" id="restart-btn">最初からやり直す</button>
      </div>

      <div class="shortcut-hint" id="shortcut-hint">
        <kbd>Enter</kbd> キーで解答・次へ進めます
      </div>
    </main>
  </div>

  <script>
    // デフォルトのフォールバックデータ
    const DEFAULT_CSV_DATA = `番号,問題,正解
1,りんご,apple
2,犬,dog
3,本,book
4,猫,cat
5,車,car
6,水,water
7,家,house
8,空,sky
9,太陽,sun
10,月,moon`;

    // アプリケーション状態
    const state = {
      rawWordList: [],       // CSVからパースした全単語リスト [{ no, question, answer }]
      playList: [],          // 出題用の配列
      currentIndex: 0,       // 現在の出題インデックス
      totalAnswered: 0,      // これまでに解答した総数
      correctCount: 0,       // 正解数
      isAnswered: false,     // 現在の問題に解答済みかどうか
      isRandom: false,       // ランダム出題フラグ
      currentFilename: 'vocabulary_list.csv'
    };

    // DOM要素の参照
    const elements = {
      csvFileInput: document.getElementById('csv-file-input'),
      csvFilenameLabel: document.getElementById('csv-filename-label'),
      statusIndicator: document.getElementById('status-indicator'),
      modeToggleBtn: document.getElementById('mode-toggle-btn'),

      scoreTotal: document.getElementById('score-total'),
      scoreCorrect: document.getElementById('score-correct'),
      scoreAccuracy: document.getElementById('score-accuracy'),

      progressBarFill: document.getElementById('progress-bar-fill'),
      cardProgressText: document.getElementById('card-progress-text'),
      cardItemId: document.getElementById('card-item-id'),
      questionText: document.getElementById('question-text'),

      answerForm: document.getElementById('answer-form'),
      answerInput: document.getElementById('answer-input'),
      submitBtn: document.getElementById('submit-btn'),

      feedbackBanner: document.getElementById('feedback-banner'),
      feedbackHeader: document.getElementById('feedback-header'),
      feedbackCorrectAnswer: document.getElementById('feedback-correct-answer'),
      nextBtn: document.getElementById('next-btn'),

      completeContainer: document.getElementById('complete-container'),
      completeEmoji: document.getElementById('complete-emoji'),
      finalTotal: document.getElementById('final-total'),
      finalCorrect: document.getElementById('final-correct'),
      finalAccuracy: document.getElementById('final-accuracy'),
      restartBtn: document.getElementById('restart-btn'),

      shortcutHint: document.getElementById('shortcut-hint')
    };

    /**
     * CSV文字列を安全に解析するパーサー
     */
    function parseCSV(csvText) {
      if (!csvText || !csvText.trim()) return [];

      const lines = csvText.split(/\r?\n/).map(line => line.trim()).filter(line => line.length > 0);
      if (lines.length < 2) return [];

      const parseLine = (line) => {
        const result = [];
        let cur = '';
        let inQuotes = false;
        for (let i = 0; i < line.length; i++) {
          const char = line[i];
          if (char === '"' || char === "'") {
            inQuotes = !inQuotes;
          } else if (char === ',' && !inQuotes) {
            result.push(cur.trim());
            cur = '';
          } else {
            cur += char;
          }
        }
        result.push(cur.trim());
        return result.map(s => s.replace(/^["']|["']$/g, '').trim());
      };

      const header = parseLine(lines[0]);
      let qIndex = header.findIndex(h => h.includes('問題'));
      let aIndex = header.findIndex(h => h.includes('正解') || h.includes('答え') || h.toLowerCase() === 'answer');
      let noIndex = header.findIndex(h => h.includes('番号') || h.toLowerCase() === 'no');

      if (qIndex === -1) qIndex = header.length > 1 ? 1 : 0;
      if (aIndex === -1) aIndex = header.length > 2 ? 2 : (header.length > 1 ? 1 : 0);
      if (noIndex === -1) noIndex = 0;

      const words = [];
      for (let i = 1; i < lines.length; i++) {
        const cols = parseLine(lines[i]);
        if (cols.length <= Math.max(qIndex, aIndex)) continue;

        const question = cols[qIndex];
        const answer = cols[aIndex];
        const no = noIndex >= 0 && cols[noIndex] ? cols[noIndex] : String(i);

        if (question && answer) {
          words.push({ no, question, answer });
        }
      }

      return words;
    }

    /**
     * 単語リストの初期化と設定
     */
    function initWordList(words, filename = '') {
      if (!words || words.length === 0) {
        alert('有効な単語データが見つかりませんでした。CSVのフォーマットを確認してください。');
        return;
      }

      state.rawWordList = words;
      if (filename) state.currentFilename = filename;

      elements.csvFilenameLabel.textContent = `${state.currentFilename} (${words.length}問)`;
      elements.statusIndicator.style.background = 'var(--success)';

      restartQuiz();
    }

    /**
     * クイズのリスタート
     */
    function restartQuiz() {
      state.playList = state.rawWordList.map(item => ({ ...item }));
      if (state.isRandom) {
        shuffleArray(state.playList);
      }

      state.currentIndex = 0;
      state.isAnswered = false;

      elements.completeContainer.style.display = 'none';
      elements.answerForm.style.display = 'flex';
      elements.shortcutHint.style.display = 'block';

      showCurrentQuestion();
    }

    /**
     * 現在の問題を画面に表示
     */
    function showCurrentQuestion() {
      if (state.currentIndex >= state.playList.length) {
        showCompletionScreen();
        return;
      }

      const item = state.playList[state.currentIndex];

      const currentNum = state.currentIndex + 1;
      const totalNum = state.playList.length;
      elements.cardProgressText.textContent = `問題 ${currentNum} / ${totalNum}`;
      elements.cardItemId.textContent = `No. ${item.no}`;
      elements.progressBarFill.style.width = `${((currentNum - 1) / totalNum) * 100}%`;

      elements.questionText.textContent = item.question;

      elements.answerInput.value = '';
      elements.answerInput.disabled = false;
      elements.answerInput.focus();

      elements.submitBtn.style.display = 'flex';
      elements.nextBtn.style.display = 'none';
      elements.feedbackBanner.style.display = 'none';
      elements.feedbackBanner.className = 'feedback-banner';

      state.isAnswered = false;
    }

    /**
     * 入力値の正規化
     */
    function normalizeText(text) {
      if (!text) return '';
      return text
        .replace(/[Ａ-Ｚａ-ｚ０-９]/g, s => String.fromCharCode(s.charCodeAt(0) - 0xFEE0))
        .trim()
        .toLowerCase();
    }

    /**
     * 解答判定
     */
    function handleAnswerSubmit() {
      if (state.isAnswered) return;

      const inputVal = elements.answerInput.value;
      if (!inputVal.trim()) {
        elements.answerInput.focus();
        return;
      }

      const currentItem = state.playList[state.currentIndex];
      const isCorrect = normalizeText(inputVal) === normalizeText(currentItem.answer);

      state.totalAnswered += 1;
      if (isCorrect) {
        state.correctCount += 1;
      }
      updateScoreboard();

      state.isAnswered = true;
      elements.answerInput.disabled = true;
      elements.submitBtn.style.display = 'none';
      elements.nextBtn.style.display = 'flex';

      elements.feedbackCorrectAnswer.textContent = currentItem.answer;

      if (isCorrect) {
        elements.feedbackBanner.className = 'feedback-banner correct';
        elements.feedbackHeader.innerHTML = `
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg>
          正解です！
        `;
      } else {
        elements.feedbackBanner.className = 'feedback-banner wrong';
        elements.feedbackHeader.innerHTML = `
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
          不正解です
        `;
      }

      const totalNum = state.playList.length;
      elements.progressBarFill.style.width = `${((state.currentIndex + 1) / totalNum) * 100}%`;

      elements.nextBtn.focus();
    }

    /**
     * 次の問題へ進む
     */
    function handleNextQuestion() {
      state.currentIndex += 1;
      showCurrentQuestion();
    }

    /**
     * スコアボードの更新
     */
    function updateScoreboard() {
      elements.scoreTotal.textContent = state.totalAnswered;
      elements.scoreCorrect.textContent = state.correctCount;

      let accuracy = 0.0;
      if (state.totalAnswered > 0) {
        accuracy = ((state.correctCount / state.totalAnswered) * 100);
      }
      elements.scoreAccuracy.textContent = `${accuracy.toFixed(1)}%`;
    }

    /**
     * 学習完了画面の表示
     */
    function showCompletionScreen() {
      elements.progressBarFill.style.width = '100%';
      elements.cardProgressText.textContent = `完了`;
      elements.cardItemId.textContent = `全問終了`;
      elements.questionText.textContent = 'お疲れ様でした！';

      elements.answerForm.style.display = 'none';
      elements.feedbackBanner.style.display = 'none';
      elements.nextBtn.style.display = 'none';
      elements.shortcutHint.style.display = 'none';

      elements.finalTotal.textContent = state.totalAnswered;
      elements.finalCorrect.textContent = state.correctCount;
      const acc = state.totalAnswered > 0 ? ((state.correctCount / state.totalAnswered) * 100).toFixed(1) : '0.0';
      elements.finalAccuracy.textContent = `${acc}%`;

      if (parseFloat(acc) >= 80) {
        elements.completeEmoji.textContent = '🌟';
      } else if (parseFloat(acc) >= 50) {
        elements.completeEmoji.textContent = '👍';
      } else {
        elements.completeEmoji.textContent = '💪';
      }

      elements.completeContainer.style.display = 'block';
      elements.restartBtn.focus();
    }

    /**
     * 配列シャッフル (Fisher-Yates)
     */
    function shuffleArray(arr) {
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
    }

    // --- イベントリスナー設定 ---

    elements.answerForm.addEventListener('submit', (e) => {
      e.preventDefault();
      handleAnswerSubmit();
    });

    elements.nextBtn.addEventListener('click', () => {
      handleNextQuestion();
    });

    window.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        if (state.isAnswered && elements.nextBtn.style.display !== 'none') {
          e.preventDefault();
          handleNextQuestion();
        }
      }
    });

    elements.restartBtn.addEventListener('click', () => {
      restartQuiz();
    });

    elements.modeToggleBtn.addEventListener('click', () => {
      state.isRandom = !state.isRandom;
      elements.modeToggleBtn.textContent = state.isRandom ? '順序: ランダム' : '順序: 順番通り';
      restartQuiz();
    });

    elements.csvFileInput.addEventListener('change', (e) => {
      const file = e.target.files && e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = (event) => {
        const text = event.target.result;
        const words = parseCSV(text);
        if (words.length > 0) {
          state.totalAnswered = 0;
          state.correctCount = 0;
          updateScoreboard();
          initWordList(words, file.name);
        } else {
          alert('CSVファイルの形式が正しくありません。「番号,問題,正解」の形式で記述されているか確認してください。');
        }
      };
      reader.readAsText(file, 'UTF-8');
      e.target.value = '';
    });

    ['dragenter', 'dragover'].forEach(eventName => {
      window.addEventListener(eventName, (e) => {
        e.preventDefault();
        e.stopPropagation();
      }, false);
    });

    window.addEventListener('drop', (e) => {
      e.preventDefault();
      e.stopPropagation();
      const files = e.dataTransfer.files;
      if (files && files.length > 0) {
        const file = files[0];
        if (file.name.endsWith('.csv') || file.type.includes('csv') || file.type.includes('text')) {
          const reader = new FileReader();
          reader.onload = (ev) => {
            const words = parseCSV(ev.target.result);
            if (words.length > 0) {
              state.totalAnswered = 0;
              state.correctCount = 0;
              updateScoreboard();
              initWordList(words, file.name);
            }
          };
          reader.readAsText(file, 'UTF-8');
        }
      }
    });

    // 同一階層の CSV を fetch 試行。なければデフォルト
    async function loadInitialCSV() {
      try {
        const response = await fetch('vocabulary_list.csv');
        if (response.ok) {
          const text = await response.text();
          const words = parseCSV(text);
          if (words.length > 0) {
            initWordList(words, 'vocabulary_list.csv');
            return;
          }
        }
        throw new Error('Fetch failed');
      } catch (err) {
        const words = parseCSV(DEFAULT_CSV_DATA);
        initWordList(words, 'vocabulary_list.csv (サンプル)');
      }
    }

    window.addEventListener('DOMContentLoaded', () => {
      loadInitialCSV();
    });
  </script>
</body>
</html>
